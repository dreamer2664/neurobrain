[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobrain"
version = "0.1.0"
description = "From-scratch neural brain (transformer + GripNet) and the brainbox runtime host"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pillow>=9.0",
]

[project.scripts]
brainbox = "brainbox.cli:main"

[tool.setuptools.packages.find]
include = ["neurobrain*", "brainbox*"]

[tool.setuptools.package-data]
brainbox = ["tokenizer.json"]
